{% extends "base.html" %}
{% block title %}Page not found - AuraStudy{% endblock %}
{% block content %}
  <div class="auth-message-icon is-error">
    <i data-lucide="compass"></i>
  </div>
  <h1 class="auth-heading">Page not found</h1>
  <p class="auth-subheading">That link doesn't lead anywhere in AuraStudy. The page may have moved, or the URL might be mistyped.</p>

  <p style="margin-top: 14px; font-size: 13px; text-align: center;">
    <a href="/" style="color: var(--aura-accent-dark); font-weight: 700; text-decoration: none;">Back to home</a>
  </p>
{% endblock %}

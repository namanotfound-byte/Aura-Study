<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}AuraStudy{% endblock %}</title>
  <script>document.title = "AuraStudy";</script>
  <script src="/static/title-lock.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="application-name" content="AuraStudy">
  <meta name="theme-color" content="#6B9080">
  <meta name="apple-mobile-web-app-title" content="AuraStudy">
  <link rel="icon" href="/static/brand/favicon-32.png?v=20250916b" type="image/png" sizes="32x32">
  <link rel="icon" href="/static/brand/favicon-48.png?v=20250916b" type="image/png" sizes="48x48">
  <link rel="icon" href="/static/brand/favicon.ico?v=20250916b" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico?v=20250916b">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png?v=20250916b">
  <link rel="stylesheet" href="/static/auth.css">
  <script>document.documentElement.classList.add('js-enabled');</script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/static/brand/aurastudy-mascot.png" alt="" class="auth-brand-mascot" width="88" height="88">
        <img src="/static/brand/aurastudy-wordmark.png" alt="AuraStudy" class="auth-brand-wordmark">
      </div>
      {% block content %}{% endblock %}
    </div>
    <p class="auth-footnote">{% block footnote %}Focus timer and study tracker.{% endblock %}</p>
  </div>
  <script>
    if (window.lucide) { lucide.createIcons(); }
  </script>
  <script src="/static/landing.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}AuraStudy{% endblock %}</title>
  <link rel="stylesheet" href="/static/auth.css">
  <script>document.documentElement.classList.add('js-enabled');</script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="/static/brand/aurastudy-mascot.png" alt="" class="auth-brand-mascot" width="88" height="88">
        <img src="/static/brand/aurastudy-wordmark.png" alt="AuraStudy" class="auth-brand-wordmark">
      </div>
      {% block content %}{% endblock %}
    </div>
    <p class="auth-footnote">{% block footnote %}Focus timer and study tracker.{% endblock %}</p>
  </div>
  <script>
    if (window.lucide) { lucide.createIcons(); }
  </script>
  <script src="/static/landing.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
